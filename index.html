<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="author" content="kebede"/><meta name="description" content="Profile photos."/><meta name="keywords" content="spots, profile, edit, post, avatar, captions, images, logo,  "/><link rel="icon" type="image/x-icon" href="favicon.ico"/><link rel="stylesheet" href="./pages/index.css"/><title>Spots</title><script defer="defer" src="main.js"></script><link href="main.css" rel="stylesheet"></head><body><div class="page"><header class="header"><img class="header__logo" src="80804e27ce061efd1ffb.svg" alt="spots logo"/></header><main class="content page__profile"><section class="profile"><div class="profile__avatar-container"><button class="profile__avatar-btn"><img class="profile__pencil-icon" src="c81b22e9874268723f8d.svg" alt="pencil-icon"/></button> <img class="profile__avatar" src="2fc47fd8e9a9bcd9612f.jpg" alt=""/></div><div class="profile__content"><div><h1 class="profile__title">User profile</h1><p class="profile__description">Lorem ipsum dolor sit amet</p></div><button type="button" class="profile__button-edit"><img class="profile__button-svg" src="501370b50e47e05b0b1c.svg" alt="edit icon"/> Edit profile</button></div><button type="button" class="profile__button-post"><img class="profile__button-jpg" src="54b98ec04923a4fc3c99.svg" alt="add symbol"/> New Post</button></section><section class="cards"><ul class="cards__list"><template id="card-template"><li class="card"><button class="card__delete-btn"></button> <img src="" class="card__image" alt=""/><div class="card__footer"><h2 class="card__title"></h2><button type="button" class="card__like-button"></button></div></li></template></ul></section></main><footer class="footer page__profile"><p class="footer__copyright">2023 &copy; Spots</p></footer><div class="modal" id="edit-profile-modal"><div class="modal__container"><button type="button" class="modal__close-btn"></button><h3 class=
